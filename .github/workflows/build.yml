# Build CI for the legacy branch group (legacy/1.21 etc).
# PR1 scope: 1.21.7 only. PR2/PR3/PR4 will add 1.21 / 1.21.1 / 1.21.4 entries
# to the matrix as each MC version is integrated into the Stonecutter setup.

name: build (legacy)
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - "legacy/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PR1 scope: 1.21.7 only. PR2 adds 1.21, PR3 adds 1.21.1, PR4 adds 1.21.4.
        # All legacy MC versions share Java 21 + Yarn + Loom 1.11-SNAPSHOT.
        include:
          - version: '1.21.7'
            java: 21
            task: build
          - version: '1.21.7'
            java: 21
            task: runServertest
          - version: '1.21.7'
            java: 21
            task: runClienttest
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: setup gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        if: ${{ matrix.task != 'runClienttest' }}
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: ./gradlew :${{ matrix.version }}:${{ matrix.task }} --stacktrace
      - name: build (runClienttest)
        if: ${{ matrix.task == 'runClienttest' }}
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        env:
          # Prevent OpenAL / SDL audio init crashes in headless CI clients.
          ALSOFT_DRIVERS: "null"
          SDL_AUDIODRIVER: "dummy"
          # Force Mesa llvmpipe so Xvfb's software GLX is enough.
          LIBGL_ALWAYS_SOFTWARE: "1"
        with:
          run: ./gradlew :${{ matrix.version }}:${{ matrix.task }} --stacktrace
      - name: capture build artifacts
        if: ${{ matrix.task == 'build' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Artifacts-legacy-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/
      - name: capture test reports
        if: ${{ always() && (matrix.task == 'runServertest' || matrix.task == 'runClienttest') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: TestReports-legacy-${{ matrix.version }}-${{ matrix.task }}
          path: |
            versions/${{ matrix.version }}/build/servertest/
            versions/${{ matrix.version }}/build/clienttest/
          if-no-files-found: ignore
