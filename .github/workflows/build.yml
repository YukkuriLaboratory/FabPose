# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uses action-ktlint for linting result
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Lint kotlin codes
        uses: ScaCap/action-ktlint@b28e095f1b6f67fa80a2a019c5043e470267baab
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          ktlint_version: 1.0.0
          fail_on_error: true

  build:
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Full include cross product: mixing a base `task` axis with
        # `include` entries that add new keys does NOT cross-multiply on
        # GitHub Actions. Each MC version (1.21.x=JDK21, 26.1+=JDK25) is
        # listed explicitly per task.
        include:
          - version: '1.21.11'
            java: 21
            task: build
          - version: '1.21.11'
            java: 21
            task: runServertest
          - version: '1.21.11'
            java: 21
            task: runClienttest
          - version: '26.1'
            java: 25
            task: build
          - version: '26.1'
            java: 25
            task: runServertest
          - version: '26.1'
            java: 25
            task: runClienttest
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: setup gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        if: ${{ matrix.task != 'runClienttest' }}
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: ./gradlew :${{ matrix.version }}:${{ matrix.task }} --stacktrace
      - name: build (runClienttest)
        if: ${{ matrix.task == 'runClienttest' }}
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        env:
          # Prevent OpenAL / SDL audio init crashes in headless CI clients.
          ALSOFT_DRIVERS: "null"
          SDL_AUDIODRIVER: "dummy"
        with:
          run: ./gradlew :${{ matrix.version }}:${{ matrix.task }} --stacktrace
      - name: capture build artifacts
        if: ${{ matrix.task == 'build' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Artifacts-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/
      - name: capture test reports
        # Upload server / client test outputs (logs, eula.txt, config) for
        # post-mortem when CI fails. FabricGameTestRunner does not emit
        # JUnit XML, so we ship the whole runtime dir.
        if: ${{ always() && (matrix.task == 'runServertest' || matrix.task == 'runClienttest') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: TestReports-${{ matrix.version }}-${{ matrix.task }}
          path: |
            versions/${{ matrix.version }}/build/servertest/
            versions/${{ matrix.version }}/build/clienttest/
          if-no-files-found: ignore
